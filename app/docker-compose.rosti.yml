services:
  web:
    image: monike-web:${MONIKE_RELEASE:-release}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_ENV: ${APP_ENV:?Nastavte APP_ENV}
        MONIKE_SITE_URL: ${MONIKE_SITE_URL:?Nastavte MONIKE_SITE_URL}
        MONIKE_PUBLIC_POCKETBASE_URL: ${MONIKE_PUBLIC_POCKETBASE_URL:?Nastavte MONIKE_PUBLIC_POCKETBASE_URL}
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      MONIKE_ENV: ${APP_ENV}
      MONIKE_SITE_URL: ${MONIKE_SITE_URL}
      MONIKE_POCKETBASE_URL: ${MONIKE_PUBLIC_POCKETBASE_URL}
      MONIKE_POCKETBASE_INTERNAL_URL: http://pocketbase:8080
      MONIKE_TRUST_PROXY: "true"
      MONIKE_HSTS_MAX_AGE: ${MONIKE_HSTS_MAX_AGE:-300}
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  pocketbase:
    image: monike-pocketbase:${MONIKE_RELEASE:-release}
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    restart: unless-stopped
    volumes:
      - ./data/pocketbase:/pb/pb_data
    environment:
      APP_ENV: ${APP_ENV}
      MONIKE_ENV: ${APP_ENV}
      MONIKE_PUBLIC_POCKETBASE_URL: ${MONIKE_PUBLIC_POCKETBASE_URL}
      MONIKE_ALLOWED_ORIGINS: ${MONIKE_SITE_URL}
      MONIKE_SUPERUSER_IPS: ${MONIKE_SUPERUSER_IPS:?Nastavte povolene IP spravce}
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:?Nastavte 32znakovy klic}
      MONIKE_BACKUP_STORAGE: ${MONIKE_BACKUP_STORAGE:-local}
      MONIKE_S3_ENDPOINT: ${MONIKE_S3_ENDPOINT:-}
      MONIKE_S3_BUCKET: ${MONIKE_S3_BUCKET:-}
      MONIKE_S3_REGION: ${MONIKE_S3_REGION:-auto}
      MONIKE_S3_ACCESS_KEY_ID: ${MONIKE_S3_ACCESS_KEY_ID:-}
      MONIKE_S3_SECRET_ACCESS_KEY: ${MONIKE_S3_SECRET_ACCESS_KEY:-}
      MONIKE_API_HSTS_MAX_AGE: ${MONIKE_HSTS_MAX_AGE:-300}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
