<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,follow">
    <title>Stránka nenalezena | Moniké</title>
    <style>
      :root { color-scheme: dark; font-family: Georgia, "Times New Roman", serif; background: #080706; color: #f2ead8; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; background: radial-gradient(circle at 50% 15%, #251d12 0, #080706 52%); }
      main { width: min(100%, 40rem); padding: clamp(2rem, 7vw, 4rem); text-align: center; border: 1px solid #8e713d; background: rgba(8, 7, 6, .88); }
      p { line-height: 1.65; }
      .code { margin: 0; color: #c7a867; font: 600 .8rem/1.2 system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: .7rem 0 1rem; font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 400; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 2rem; }
      a { min-height: 44px; display: inline-flex; align-items: center; padding: .7rem 1rem; border: 1px solid #b99858; color: #f2ead8; font: 600 .9rem/1 system-ui, sans-serif; text-decoration: none; }
      a:hover, a:focus-visible { color: #080706; background: #d0b06c; outline: 2px solid #f2ead8; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Chyba 404</p>
      <h1>Tahle cesta nikam nevede</h1>
      <p>Hledaná stránka neexistuje nebo už není veřejná.</p>
      <nav aria-label="Další možnosti">
        <a href="/">Zpět na úvod</a>
        <a href="/blog">Přejít na blog</a>
      </nav>
    </main>
  </body>
</html>
